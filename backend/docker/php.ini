; The app enforces the real photo limits (MARKETPLACE_MAX_IMAGE_KB, 5 MB, and up to 8 photos per
; listing) with clear messages. PHP's ceilings sit well above them so a bigger file reaches that check
; instead of being dropped by PHP with a vague "failed to upload".
upload_max_filesize = 16M
post_max_size = 136M
max_file_uploads = 20
; Resizing a large phone photo with GD needs room.
memory_limit = 512M
expose_php = Off

; The code never changes inside a running container, so files are compiled once.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
