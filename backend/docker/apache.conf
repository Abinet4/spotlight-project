ServerName localhost
ServerTokens Prod
ServerSignature Off
# Each Apache process serves one connection at a time and waits on it after answering, in case the same
# visitor sends more. With Debian's 5 seconds, a crowd arriving at once took every process for 5 idle
# seconds each and the rest queued: 300 page loads at once took 52 s instead of 10 s.
KeepAliveTimeout 1
# This server sends JSON and photos only (the shop pages come from elsewhere), so nothing it sends may
# run scripts, be framed by another site, or be guessed as another file type.
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "no-referrer"
Header always set Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'"
# Browsers only keep this when the page came over HTTPS (the host's proxy adds it), so plain HTTP is unaffected.
Header always set Strict-Transport-Security "max-age=31536000"
# Uploads get new file names, so browsers may keep photos for a week (re-made copies show within it).
<LocationMatch "^/storage/">
    Header set Cache-Control "public, max-age=604800"
</LocationMatch>
# API answers are JSON; compress them like pages (Debian's default list leaves JSON out).
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE application/json text/csv
</IfModule>
